name: Comprobar y desplegar

on:
  push:
  pull_request:
  workflow_dispatch:

# Lo mínimo: leer el repo y publicar en Pages. Nada de escribir en el código.
permissions:
  contents: read
  pages: write
  id-token: write

# Una cola POR RAMA, no una global.
#
# Antes esto era `group: pages` a secas, y como el grupo no llevaba la rama,
# todas las ejecuciones compartían una única cola: un push a cualquier rama
# cancelaba un despliegue de main que estuviera esperando. Pasó de verdad —el
# despliegue del PR #2 murió cinco segundos después de un push a la rama de
# trabajo— y no se nota, porque un run cancelado no sale en rojo.
#
# Cancelar lo obsoleto de la MISMA rama sí interesa: ahorra minutos y no se
# pierde nada. La serialización de los despliegues se resuelve en el job que
# publica, no aquí.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comprobar:
    name: Tests y verificación offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditar dependencias
        # El marcador no manda nada a ningún sitio; una dependencia con un CVE
        # conocido es la vía más fácil de que eso deje de ser verdad. Sigue
        # bloqueando: el script reintenta cuando el registro no contesta, pero
        # nunca convierte un fallo en un aviso. El por qué, en el script.
        run: bash scripts/auditar.sh

      - name: Tests del dominio y la persistencia
        run: npm test

      # `npm run build` ya pasa el typecheck de la app y del service worker.
      - name: Compilar
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Verificación offline
        # Con --subruta, porque Pages sirve el proyecto en /LaCuenta-Scoreboard/
        # y no en la raíz del dominio: es el caso que de verdad se despliega.
        run: node scripts/verificar-offline.mjs --subruta

      - name: Preparar artefacto de Pages
        if: github.ref_name == 'main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  desplegar:
    name: Publicar en GitHub Pages
    needs: comprobar
    # Solo desde main. Atado al nombre a propósito y no a "la rama por
    # defecto": lo que se publica en internet no debería cambiar solo porque
    # alguien toque un ajuste del repositorio.
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest

    # Aquí sí hace falta cola global: GitHub Pages solo admite un despliegue a
    # la vez. Solo main llega a este job, así que ninguna rama puede
    # interferir. Y sin cancelar el que esté a medias.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Configurar Pages
        # Sin `enablement`: crear el sitio de Pages es administración del
        # repositorio y el GITHUB_TOKEN de Actions no llega ahí, por mucho
        # `pages: write` que tenga. Hay que activarlo una sola vez a mano en
        # Ajustes > Pages > Source: GitHub Actions. A partir de ahí, este paso
        # solo lee la configuración y el despliegue va solo en cada push.
        uses: actions/configure-pages@v6

      - name: Desplegar
        id: despliegue
        uses: actions/deploy-pages@v5
